name: iOS Signed Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version (e.g., 1.0.0)'
        required: true
      build_number:
        description: 'Build number (e.g., 1)'
        required: true
      upload:
        description: 'Upload the IPA to TestFlight (requires App Store Connect API key)'
        required: false
        default: 'false'
        type: boolean

jobs:
  build-ios-signed:
    name: Build Signed iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Generate app icons and splash screens
        run: npx capacitor-assets generate --ios

      - name: Import certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo "$BUILD_CERTIFICATE_BASE64" | tr -d '[:space:]' | base64 --decode > $CERTIFICATE_PATH

          PP_TMP=$RUNNER_TEMP/profile.mobileprovision
          echo "$PROVISIONING_PROFILE_BASE64" | tr -d '[:space:]' | base64 --decode > $PP_TMP
          PP_UUID=$(security cms -D -i $PP_TMP | plutil -extract UUID raw -)
          echo "Profile UUID: $PP_UUID"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_TMP ~/Library/MobileDevice/Provisioning\ Profiles/$PP_UUID.mobileprovision

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -k $KEYCHAIN_PATH

          echo "Certificate identities in keychain:"
          security find-identity -v -p codesigning $KEYCHAIN_PATH || echo "no signing identities found"

          security list-keychain -d user -s $KEYCHAIN_PATH login.keychain-db
          security default-keychain -s $KEYCHAIN_PATH

      - name: Update version
        run: |
          cd ios/App/App
          plutil -replace CFBundleShortVersionString -string "${{ github.event.inputs.version }}" Info.plist
          plutil -replace CFBundleVersion -string "${{ github.event.inputs.build_number }}" Info.plist

      - name: Archive iOS app
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath ${{ github.workspace }}/build/App.xcarchive \
            -sdk iphoneos \
            archive \
            DEVELOPMENT_TEAM=$TEAM_ID \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="Bible App AppStore" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Check archive
        run: |
          ls -la ${{ github.workspace }}/build/ || echo "no build dir"
          find ~/Library/Developer/Xcode/Archives -name "*.xcarchive" 2>/dev/null || true

      - name: Export IPA
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" -c "Add :teamID string $TEAM_ID" -c "Add :uploadSymbols bool true" -c "Add :signingStyle string manual" -c "Add :provisioningProfiles dict" -c "Add :provisioningProfiles:com.leyesapps.bibleapp string Bible App AppStore" ExportOptions.plist 2>/dev/null || true
          if [ ! -f ExportOptions.plist ]; then
            printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n<key>method</key>\n<string>app-store-connect</string>\n<key>teamID</key>\n<string>%s</string>\n<key>uploadSymbols</key>\n<true/>\n<key>signingStyle</key>\n<string>manual</string>\n<key>provisioningProfiles</key>\n<dict>\n<key>com.leyesapps.bibleapp</key>\n<string>Bible App AppStore</string>\n</dict>\n</dict>\n</plist>\n' "$TEAM_ID" > ExportOptions.plist
          fi

          xcodebuild -exportArchive \
            -archivePath ${{ github.workspace }}/build/App.xcarchive \
            -exportPath ${{ github.workspace }}/build/export \
            -exportOptionsPlist ExportOptions.plist

      - name: Locate signed IPA
        id: ipa
        run: |
          IPA=$(find "${{ github.workspace }}/build/export" -maxdepth 1 -name '*.ipa' | head -n 1)
          if [ -z "$IPA" ]; then
            echo "::error::No IPA found in build/export"
            exit 1
          fi
          echo "Found signed IPA: $IPA"
          echo "path=$IPA" >> "$GITHUB_OUTPUT"

      - name: Verify App Store Connect credentials
        if: inputs.upload == true
        env:
          ISSUER: ${{ vars.APPSTORE_ISSUER_ID }}
          KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          missing=""
          [ -z "$ISSUER" ] && missing="$missing APPSTORE_ISSUER_ID (variable)"
          [ -z "$KEY_ID" ] && missing="$missing APPSTORE_API_KEY_ID (variable)"
          [ -z "$PRIVATE_KEY" ] && missing="$missing APPSTORE_API_PRIVATE_KEY (secret)"
          if [ -n "$missing" ]; then
            echo "::error::Missing App Store Connect credentials:$missing"
            exit 1
          fi

      - name: Upload to TestFlight
        if: inputs.upload == true
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          uses-non-exempt-encryption: 'false'
          # 'false' on the first upload: Apple requires Test Information
          # (Beta App Description, Feedback Email, primary locale) before
          # the action can wait for processing. Flip to 'true' once that
          # form is filled in in App Store Connect.
          wait-for-processing: 'false'

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: bible-app-ios-signed
          path: ${{ github.workspace }}/build/export/*.ipa
          retention-days: 30

      - name: Cleanup keychain
        if: always()
        run: |
          security default-keychain -s login.keychain-db
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db
