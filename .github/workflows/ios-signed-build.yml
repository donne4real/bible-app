name: iOS Signed Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version (e.g., 1.0.0)'
        required: true
      build_number:
        description: 'Build number (e.g., 1)'
        required: true

jobs:
  build-ios-signed:
    name: Build Signed iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Generate app icons and splash screens
        run: npx capacitor-assets generate --ios

      - name: Import certificate and provisioning profile
        uses: apple-actions/import-certificates@v3
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP_TMP=$RUNNER_TEMP/profile.mobileprovision
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode > $PP_TMP
          PP_UUID=$(security cms -D -i $PP_TMP | plutil -extract UUID raw -)
          echo "Profile UUID: $PP_UUID"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_TMP ~/Library/MobileDevice/Provisioning\ Profiles/$PP_UUID.mobileprovision

      - name: Update version
        run: |
          cd ios/App/App
          plutil -replace CFBundleShortVersionString -string "${{ github.event.inputs.version }}" Info.plist
          plutil -replace CFBundleVersion -string "${{ github.event.inputs.build_number }}" Info.plist

      - name: Archive iOS app
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath ${{ github.workspace }}/build/App.xcarchive \
            -sdk iphoneos \
            DEVELOPMENT_TEAM=$TEAM_ID \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="Bible App AppStore" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Check archive
        run: |
          echo "Checking for archive..."
          ls -la ${{ github.workspace }}/build/ || echo "no build dir"
          find ${{ runner.temp }} -name "*.xcarchive" 2>/dev/null || true
          find ~/Library/Developer/Xcode/Archives -name "*.xcarchive" 2>/dev/null || true

      - name: Export IPA
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" -c "Add :teamID string $TEAM_ID" -c "Add :uploadSymbols bool true" ExportOptions.plist 2>/dev/null || true
          if [ ! -f ExportOptions.plist ]; then
            printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n<key>method</key>\n<string>app-store-connect</string>\n<key>teamID</key>\n<string>%s</string>\n<key>uploadSymbols</key>\n<true/>\n</dict>\n</plist>\n' "$TEAM_ID" > ExportOptions.plist
          fi

          xcodebuild -exportArchive \
            -archivePath ${{ github.workspace }}/build/App.xcarchive \
            -exportPath ${{ github.workspace }}/build/export \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: bible-app-ios-signed
          path: ${{ github.workspace }}/build/export/*.ipa
          retention-days: 30
